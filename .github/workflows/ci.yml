# Roda a cada push e pull request: testes e lint do Python, build do frontend e da imagem Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  imagem:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rede-vendas:ci .
      - name: A imagem sobe e responde
        run: |
          docker run -d --name rv -p 8000:8000 \
            -e REDE_VENDAS_ADMIN_LOGIN=ci -e REDE_VENDAS_ADMIN_SENHA=senha-do-ci \
            -e REDE_VENDAS_COOKIE_SEGURO=0 rede-vendas:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/saude && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "Rede de Vendas"
          curl -sf -X POST localhost:8000/api/auth/entrar \
            -H 'Content-Type: application/json' -d '{"login":"ci","senha":"senha-do-ci"}'
